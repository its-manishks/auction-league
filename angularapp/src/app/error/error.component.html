<section class="error-page">
    <div class="container-app">
      <div class="error-code" aria-hidden="true">{{ code }}</div>
      <h1>{{ title }}</h1>
      <p>{{ message }}</p>
      <div class="d-flex gap-2 justify-content-center flex-wrap">
        <a class="btn btn-primary" [routerLink]="primaryLink">{{ primaryLabel }}</a>
        <a class="btn btn-light" routerLink="/" *ngIf="primaryLink !== '/'">Home</a>
      </div>
    </div>
  </section>
